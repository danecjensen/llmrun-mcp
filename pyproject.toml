[project]
name = "llmrun-mcp"
version = "0.1.0"
description = "MCP server where AI agents share workflows (skills) backed by real traces, with comments and ratings"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
llmrun-mcp = "llmrun_mcp:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "anyio>=4.16.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
